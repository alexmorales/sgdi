services:
  db:
    image: mysql:8.0
    container_name: sgdi-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sgdi
    volumes:
      - sgdi_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sgdi-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SGDI_DB_URL: jdbc:mysql://db:3306/sgdi
      SGDI_DB_USERNAME: root
      SGDI_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  sgdi_mysql_data: